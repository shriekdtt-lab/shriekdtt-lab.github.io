<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shriekd — Horror Gaming Reactions</title>
  <meta name="tiktok-domain-verification" content="N5sMrOgc75WPao7qbDD0JyexLG0n45wJ "/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0c0c0c;
      color: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── HERO ── */
    .hero {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 60px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "/// ///";
      position: absolute;
      font-family: Impact, sans-serif;
      font-size: clamp(80px, 20vw, 220px);
      color: rgba(204,0,0,0.05);
      letter-spacing: -4px;
      pointer-events: none;
      white-space: nowrap;
    }

    .logo-wrap { position: relative; display: inline-block; }

    .logo-main {
      font-family: Impact, 'Arial Narrow', sans-serif;
      font-size: clamp(52px, 14vw, 120px);
      letter-spacing: 0.12em;
      color: #ffffff;
      position: relative;
      z-index: 2;
      line-height: 1;
    }

    .logo-ghost {
      font-family: Impact, 'Arial Narrow', sans-serif;
      font-size: clamp(52px, 14vw, 120px);
      letter-spacing: 0.12em;
      color: #cc0000;
      position: absolute;
      top: 0; left: 4px;
      clip-path: polygon(0 40%, 100% 40%, 100% 56%, 0 56%);
      z-index: 1;
      line-height: 1;
    }

    .tagline {
      margin-top: 16px;
      font-size: clamp(11px, 2.5vw, 15px);
      color: #888;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    .tagline span { color: #cc0000; }

    /* ── ABOUT ── */
    .about {
      max-width: 560px;
      text-align: center;
      padding: 0 24px 64px;
      font-size: 16px;
      line-height: 1.7;
      color: #aaa;
    }

    /* ── LINKS ── */
    .links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 24px 80px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.8; }

    .btn-youtube {
      background: #cc0000;
      color: #fff;
    }

    .btn-tiktok {
      background: #fff;
      color: #0c0c0c;
    }

    /* ── DIVIDER ── */
    .divider {
      width: 40px;
      height: 2px;
      background: #cc0000;
      margin: 0 auto 48px;
    }

    /* ── FOOTER ── */
    footer {
      margin-top: auto;
      width: 100%;
      border-top: 1px solid #1e1e1e;
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: #444;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    footer a {
      color: #555;
      text-decoration: none;
    }
    footer a:hover { color: #cc0000; }

    .footer-links {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ── CORNER DECO ── */
    .corner {
      position: fixed;
      width: 20px; height: 20px;
      pointer-events: none;
    }
    .corner-tl { top: 16px; left: 16px; border-top: 2px solid #cc0000; border-left: 2px solid #cc0000; }
    .corner-tr { top: 16px; right: 16px; border-top: 2px solid #cc0000; border-right: 2px solid #cc0000; }
    .corner-bl { bottom: 16px; left: 16px; border-bottom: 2px solid #cc0000; border-left: 2px solid #cc0000; }
    .corner-br { bottom: 16px; right: 16px; border-bottom: 2px solid #cc0000; border-right: 2px solid #cc0000; }
  </style>
</head>
<body>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <section class="hero">
    <div class="logo-wrap">
      <div class="logo-ghost">SHRIEKD</div>
      <div class="logo-main">SHRIEKD</div>
    </div>
    <p class="tagline">funny reactions <span>·</span> horror <span>·</span> trolling</p>
  </section>

  <div class="divider"></div>

  <section class="about">
    Daily horror gaming clips, jumpscares, and the most chaotic troll moments on the internet.

  <div class="links">

    </a>
    <a class="btn btn-tiktok" href="https://www.tiktok.com/@shriekd" target="_blank">
      ♪ TikTok
    </a>
  </div>

  <footer>
    <div class="footer-links">
      <a href="/terms.html">Terms of Service</a>

      <a href="mailto:shriekd.contact@gmail.com">Contact</a>
    </div>
    <div>© 2026 Shriekd. All rights reserved.</div>
  </footer>

</body>
</html>
